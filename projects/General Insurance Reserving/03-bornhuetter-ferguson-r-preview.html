<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>03_bornhuetter_ferguson.R preview</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/r.min.js"></script>

  <style>
    :root{
      --bg:#0b0f17;
      --panel:#0f172a;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --line:rgba(255,255,255,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .wrap{padding:10px}
    .header{
      margin-bottom:10px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(255,255,255,.02);
      color:var(--muted);
      font-size:12px;
    }
    pre{
      margin:0;
      border:1px solid var(--line);
      border-radius:12px;
      overflow:auto;
      background:var(--panel);
      min-height: calc(100vh - 72px);
    }
    code{
      display:block;
      padding:14px;
      font-size:12.5px;
      line-height:1.45;
      white-space:pre;
    }
    .err{
      color:#fca5a5;
      padding:12px;
      border:1px solid rgba(252,165,165,.25);
      border-radius:12px;
      background:rgba(127,29,29,.15);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size:13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">03_bornhuetter_ferguson.R</div>
    <pre><code id="code" class="language-r">Loading...</code></pre>
    <div id="error" class="err" style="display:none; margin-top:10px;"></div>
  </div>

  <script>
    const codeEl = document.getElementById("code");
    const errEl = document.getElementById("error");
    const paths = ["./code/03_bornhuetter_ferguson.R"];

    async function loadFirstAvailable() {
      let lastErr = null;

      for (const path of paths) {
        try {
          const res = await fetch(path);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          codeEl.textContent = text;
          hljs.highlightElement(codeEl);
          return;
        } catch (err) {
          lastErr = err;
        }
      }

      codeEl.textContent = "";
      errEl.style.display = "block";
      errEl.innerHTML = `
        Could not load <strong>03_bornhuetter_ferguson.R</strong> (${lastErr ? lastErr.message : "unknown error"}).<br>
        Check that the file exists at:
        <code>./code/03_bornhuetter_ferguson.R</code>
      `;
    }

    loadFirstAvailable();
  </script>
</body>
</html>
